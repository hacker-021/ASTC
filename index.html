  <!-- Google Fonts: Fraunces, Plus Jakarta Sans, JetBrains Mono -->

      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']

  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      background-color: #070A12;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Fullscreen Interactive 3D World Canvas */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
      display: block;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Virtual scroll track driving the smooth 3D camera spline flight */
    #virtual-scroll-track {
      position: relative;
      z-index: 2;
      pointer-events: none;
    }
    .chapter-section {
      height: 120vh;
      width: 100%;
      pointer-events: none;
    }

    /* Pure open-air floating headline shadow (zero boxes) */
    .headline-aurora {
      color: #F8FAFC;
      text-shadow:
        0 4px 28px rgba(4, 6, 14, 0.98),
        0 2px 10px rgba(7, 10, 18, 0.94),
        0 0 36px rgba(129, 140, 248, 0.22);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #070A12; }
    ::-webkit-scrollbar-thumb { background: #312E81; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #818CF8; }
  </style>
</head>
<body class="bg-[#070A12] text-slate-50 selection:bg-indigo-500/30 selection:text-white">

    const TOTAL_ISLANDS = STORY_ISLANDS.length;
    let currentChapterIndex = 1;
    let cuesVisible = true;
    let warpPulse = 0;
    let targetScrollT = 0;

    /**
     * Generates a soft radial glow texture for floating bokeh / starfield motes
     */
    function createBokehTexture() {
      const size = 64;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.32, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.68, 'rgba(255,255,255,0.22)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    /**
     * Renders 100% transparent floating 3D holographic typography onto a canvas texture
     */
    function drawFloatingTextCanvas(canvasEl, island, idx) {
      const ctx = canvasEl.getContext('2d');
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      ctx.shadowColor = 'rgba(4, 6, 14, 0.96)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      const islandNum = String(idx + 1).padStart(2, '0');
      const totalStr = String(TOTAL_ISLANDS).padStart(2, '0');

      // Kicker Tag
      ctx.fillStyle = island.accent;
      ctx.font = '700 24px "JetBrains Mono", monospace';
      ctx.fillText('ISLAND ' + islandNum + ' / ' + totalStr + '  •  ' + island.boardTag, 36, 66, 952);

      // Display Serif Title
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 48px "Fraunces", Georgia, serif';
      ctx.fillText(island.boardTitle, 36, 138, 952);

      // Luminous Subtitle
      ctx.fillStyle = island.accent;
      ctx.font = '700 31px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(island.boardSub, 36, 196, 952);

      // Minimalist glowing accent underline
      ctx.shadowBlur = 12;
      ctx.strokeStyle = island.accent;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(36, 226);
      ctx.lineTo(248, 226);
      ctx.stroke();

      // Open-air holographic bullet points
      ctx.shadowBlur = 18;
      ctx.font = '600 29px "Plus Jakarta Sans", sans-serif';
      island.boardPoints.forEach(function (pt, i) {
        const yPos = 292 + i * 64;
        ctx.fillStyle = island.accent;
        ctx.fillText('✦', 36, yPos);
        ctx.fillStyle = '#E2E8F0';
        ctx.fillText(pt, 78, yPos, 910);
      });
    }

    function createFloatingTextTexture(island, idx) {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      drawFloatingTextCanvas(c, island, idx);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return { tex: tex, canvas: c, island: island, idx: idx };
    }

    /**
     * Renders a floating mono label sprite above each 3D sculpture
     */
    function drawTagSpriteCanvas(canvasEl, text, accentColor) {
      const ctx = canvasEl.getContext('2d');
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.shadowColor = 'rgba(4, 6, 14, 0.96)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = accentColor;
      ctx.font = '700 27px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(text, 256, 76, 488);
    }

    function createFloatingTagSprite(text, accentColor) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 128;
      drawTagSpriteCanvas(c, text, accentColor);

      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(7.8, 1.95, 1);
      return { sprite: sprite, tex: tex, canvas: c, text: text, accent: accentColor };
    }

    /**
     * Builds the minimal right-edge vertical 7-dot island navigator
     */
    function buildDotNavigator() {
      const nav = document.getElementById('island-dot-nav');
      if (!nav) return;
      nav.innerHTML = '';

      STORY_ISLANDS.forEach(function (island, idx) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.index = String(idx + 1);
        btn.setAttribute('aria-label', 'Jump to Island ' + (idx + 1) + ': ' + island.shortTitle);
        btn.className = 'group relative flex items-center justify-end p-2 cursor-pointer focus:outline-none';

        const tooltip = document.createElement('span');
        tooltip.className =
          'mr-3 px-2.5 py-1 rounded-full font-mono text-[11px] font-semibold whitespace-nowrap ' +
          'opacity-0 translate-x-2 pointer-events-none transition-all duration-200 group-hover:opacity-100 group-hover:translate-x-0 ' +
          'backdrop-blur-md border shadow-lg bg-[#0F1424]/90 border-indigo-300/20 text-slate-100';
        tooltip.textContent = String(idx + 1).padStart(2, '0') + ' · ' + island.shortTitle;

        const dot = document.createElement('span');
        dot.className = 'dot-pip block rounded-full transition-all duration-300 w-2 h-2 bg-slate-400/40 group-hover:scale-125';

        btn.appendChild(tooltip);
        btn.appendChild(dot);
        btn.addEventListener('click', function () {
          jumpToChapter(idx + 1);
        });

        nav.appendChild(btn);
      });
    }

    function updateDotNavigator(activeIndex) {
      const nav = document.getElementById('island-dot-nav');
      if (!nav) return;
      const buttons = nav.querySelectorAll('button');
      buttons.forEach(function (btn, idx) {
        const pip = btn.querySelector('.dot-pip');
        if (!pip) return;
        const isActive = idx + 1 === activeIndex;
        const accent = STORY_ISLANDS[idx].accent;
        if (isActive) {
          pip.style.width = '10px';
          pip.style.height = '24px';
          pip.style.backgroundColor = accent;
          pip.style.boxShadow = '0 0 14px ' + accent + 'AA';
        } else {
          pip.style.width = '8px';
          pip.style.height = '8px';
          pip.style.backgroundColor = 'rgba(148, 163, 184, 0.35)';
          pip.style.boxShadow = 'none';
        }
      });
    }

    /**
     * Populates Sir's 1-line Speaker Cues for the currently active island
     */
    function renderSpeakerCues(islandIndex) {
      const idx = Math.max(0, Math.min(TOTAL_ISLANDS - 1, islandIndex - 1));
      const data = STORY_ISLANDS[idx];
      const kickerEl = document.getElementById('cues-kicker');
      const listEl = document.getElementById('cues-list');
      if (!kickerEl || !listEl) return;

      kickerEl.textContent =
        "SIR'S CUES · " +
        String(idx + 1).padStart(2, '0') +
        ' / ' +
        String(TOTAL_ISLANDS).padStart(2, '0') +
        ' · ' +
        data.shortTitle.toUpperCase();
      kickerEl.style.color = data.accent;

      listEl.innerHTML = '';
      data.speakerCues.forEach(function (line) {
        const li = document.createElement('li');
        li.className = 'flex items-start gap-2';
        const bullet = document.createElement('span');
        bullet.textContent = '▸';
        bullet.style.color = data.accent;
        bullet.className = 'mt-0.5 shrink-0 font-bold';
        const txt = document.createElement('span');
        txt.textContent = line;
        li.appendChild(bullet);
        li.appendChild(txt);
        listEl.appendChild(li);
      });
    }

    function toggleSpeakerCues() {
      cuesVisible = !cuesVisible;
      const panel = document.getElementById('speaker-cues-panel');
      const dot = document.getElementById('cues-status-dot');
      if (panel) {
        if (cuesVisible) {
          panel.style.opacity = '1';
          panel.style.transform = 'translateY(0)';
          panel.style.pointerEvents = 'auto';
        } else {
          panel.style.opacity = '0';
          panel.style.transform = 'translateY(14px)';
          panel.style.pointerEvents = 'none';
        }
      }
      if (dot) {
        dot.className = cuesVisible
          ? 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.85)] transition-all'
          : 'w-2 h-2 rounded-full bg-slate-500 transition-all';
      }
    }

    function updateStoryHUD(islandIndex) {
      const idx = Math.max(0, Math.min(TOTAL_ISLANDS - 1, islandIndex - 1));
      const hEl = document.getElementById('story-headline');
      if (currentChapterIndex === idx + 1 && hEl && hEl.dataset.loaded === '1') {
        return;
      }
      currentChapterIndex = idx + 1;
      const data = STORY_ISLANDS[idx];
      if (hEl) {
        hEl.dataset.loaded = '1';
        hEl.textContent = data.headline;
      }
      updateDotNavigator(currentChapterIndex);
      renderSpeakerCues(currentChapterIndex);
    }

    function jumpToChapter(num) {
      const clamped = Math.max(1, Math.min(TOTAL_ISLANDS, num));
      warpPulse = 1.15;
      targetScrollT = (clamped - 1) / (TOTAL_ISLANDS - 1);
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      window.scrollTo({ top: targetScrollT * maxScroll, behavior: 'smooth' });
      updateStoryHUD(clamped);
    }

    /**
     * Initializes the complete Three.js Velvet Twilight Aurora 3D World
     */
    function initComplete3DWorld() {
      try {
        const canvas = document.getElementById('webgl-canvas');
        if (!canvas || typeof THREE === 'undefined') return;

        buildDotNavigator();

        const cuesBtn = document.getElementById('cues-toggle-btn');
        if (cuesBtn) {
          cuesBtn.addEventListener('click', toggleSpeakerCues);
        }

        // ── 1. Scene, Fog & Renderer ──
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070A12);
        scene.fog = new THREE.FogExp2(0x070A12, 0.0072);

        const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 560);

        const renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // ── 2. Rich Ambient + Studio + Dual Traveling Aurora Point Lights ──
        scene.add(new THREE.AmbientLight(0xC7D2FE, 0.55));

        const hemiLight = new THREE.HemisphereLight(0xA5B4FC, 0x0B0F1E, 0.65);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xF5F3FF, 1.15);
        dirLight.position.set(28, 65, 35);
        scene.add(dirLight);

        const pointLightCyanMint = new THREE.PointLight(0x5EEAD4, 3.1, 95);
        const pointLightOrchidCoral = new THREE.PointLight(0xF472B6, 2.9, 95);
        scene.add(pointLightCyanMint);
        scene.add(pointLightOrchidCoral);

        // ── 3. Winding 3D Spline Highway for the 7 Islands ──
        const islandWaypoints = [
          new THREE.Vector3(0, 2, 0),
          new THREE.Vector3(24, 4, -55),
          new THREE.Vector3(-22, 6, -110),
          new THREE.Vector3(26, 3, -165),
          new THREE.Vector3(-24, 5, -220),
          new THREE.Vector3(22, 4, -275),
          new THREE.Vector3(0, 6, -330)
        ];

        const cameraWaypoints = islandWaypoints.map(function (v) {
          return new THREE.Vector3(v.x, v.y + 3.2, v.z + 21);
        });

        const roadCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 30),
          ...islandWaypoints.map(function (v) { return new THREE.Vector3(v.x, v.y - 2.2, v.z); }),
          new THREE.Vector3(0, 4, -365)
        ]);

        // Sleek Glowing Energy-Ribbon 3D Highway
        const roadGeo = new THREE.TubeGeometry(roadCurve, 280, 1.45, 10, false);
        const roadMat = new THREE.MeshStandardMaterial({
          color: 0x13192D,
          emissive: 0x252B58,
          emissiveIntensity: 0.55,
          roughness: 0.28,
          metalness: 0.8
        });
        scene.add(new THREE.Mesh(roadGeo, roadMat));

        // Streaming Aurora Energy Particles along the Highway
        const streamPalette = [0x818CF8, 0x5EEAD4, 0xC084FC, 0xFB7185, 0xFBBF24];
        const streamCount = 80;
        const streamSpheres = [];
        const streamGeo = new THREE.SphereGeometry(0.24, 12, 12);
        for (let i = 0; i < streamCount; i++) {
          const colHex = streamPalette[i % streamPalette.length];
          const smat = new THREE.MeshBasicMaterial({ color: colHex });
          const sp = new THREE.Mesh(streamGeo, smat);
          scene.add(sp);
          streamSpheres.push({ mesh: sp, t: i / streamCount, orbitOffset: i * 0.45 });
        }

        // Subtle Dark Indigo Wireframe Horizon Terrain
        const terrainGeo = new THREE.PlaneGeometry(340, 500, 48, 76);
        terrainGeo.rotateX(-Math.PI / 2);
        const posAttr = terrainGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
          const vx = posAttr.getX(i);
          const vz = posAttr.getZ(i);
          const wave = Math.sin(vx * 0.048) * Math.cos(vz * 0.038) * 3.6;
          const canyon = Math.abs(vx) > 22 ? (Math.abs(vx) - 22) * 0.22 : 0;
          posAttr.setY(i, -10.5 + wave + canyon);
        }
        terrainGeo.computeVertexNormals();
        const terrainMat = new THREE.MeshBasicMaterial({
          color: 0x3730A3,
          wireframe: true,
          transparent: true,
          opacity: 0.2
        });
        const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
        terrainMesh.position.set(0, 0, -170);
        scene.add(terrainMesh);

        // Colorful Floating Starfield / Bokeh Mote Sky
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1900;
        const starPos = new Float32Array(starCount * 3);
        const starCols = new Float32Array(starCount * 3);
        const starPalette = [0x818CF8, 0x5EEAD4, 0x38BDF8, 0xC084FC, 0xFB7185, 0xFBBF24];
        const tmpColor = new THREE.Color();
        for (let i = 0; i < starCount; i++) {
          starPos[i * 3] = (Math.random() - 0.5) * 260;
          starPos[i * 3 + 1] = -4 + Math.random() * 98;
          starPos[i * 3 + 2] = 45 - Math.random() * 440;
          tmpColor.setHex(starPalette[i % starPalette.length]);
          starCols[i * 3] = tmpColor.r;
          starCols[i * 3 + 1] = tmpColor.g;
          starCols[i * 3 + 2] = tmpColor.b;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starCols, 3));

        const bokehTex = createBokehTexture();
        const starMat = new THREE.PointsMaterial({
          size: 0.92,
          map: bokehTex,
          vertexColors: true,
          transparent: true,
          opacity: 0.85,
          depthWrite: false
        });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // ── 4. Build All 7 Islands (Disc Pads, Holographic Text & Bespoke Sculptures) ──
        const animatedGroups = [];
        const floatingTextMeshes = [];
        const textTexturesToRefresh = [];
        const tagSpritesToRefresh = [];

        islandWaypoints.forEach(function (center, idx) {
          const islandData = STORY_ISLANDS[idx];
          const group = new THREE.Group();
          group.position.copy(center);
          scene.add(group);

          const accentHex = new THREE.Color(islandData.accent).getHex();

          // Metallic Dark-Slate / Indigo Floating Disc Pad
          const discGeo = new THREE.CylinderGeometry(9.6, 7.3, 1.15, 40);
          const discMat = new THREE.MeshStandardMaterial({
            color: 0x111626,
            emissive: 0x1A203A,
            emissiveIntensity: 0.3,
            roughness: 0.22,
            metalness: 0.85
          });
          const discMesh = new THREE.Mesh(discGeo, discMat);
          discMesh.position.set(0, -1.2, 0);
          group.add(discMesh);

          // Luminous Pastel-Neon Halo Ring
          const haloGeo = new THREE.TorusGeometry(9.8, 0.11, 14, 56);
          haloGeo.rotateX(Math.PI / 2);
          const haloMat = new THREE.MeshBasicMaterial({ color: accentHex });
          const haloMesh = new THREE.Mesh(haloGeo, haloMat);
          haloMesh.position.set(0, -0.56, 0);
          group.add(haloMesh);

          // Pulsing Outer Energy Ring
          const outerRingGeo = new THREE.TorusGeometry(11.3, 0.055, 10, 56);
          outerRingGeo.rotateX(Math.PI / 2);
          const outerRingMat = new THREE.MeshBasicMaterial({
            color: accentHex,
            transparent: true,
            opacity: 0.48
          });
          const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
          outerRing.position.set(0, -0.56, 0);
          group.add(outerRing);
          animatedGroups.push({ type: 'ringPulse', mesh: outerRing, offset: idx });

          // Floating 3D Transparent Holographic Text on Left
          const textBundle = createFloatingTextTexture(islandData, idx);
          textTexturesToRefresh.push(textBundle);
          const textGeo = new THREE.PlaneGeometry(13.4, 6.7);
          const textMat = new THREE.MeshBasicMaterial({
            map: textBundle.tex,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide
          });
          const textMesh = new THREE.Mesh(textGeo, textMat);
          textMesh.position.set(-4.8, 4.7, 1.6);
          textMesh.rotation.y = 0.16;
          group.add(textMesh);
          floatingTextMeshes.push({ mesh: textMesh, baseY: 4.7, offset: idx * 0.85 });

          // Bespoke Animated 3D Diorama Sculpture on Right
          const diorama = new THREE.Group();
          diorama.position.set(5.2, 3.2, 0.8);
          group.add(diorama);

          const tagBundle = createFloatingTagSprite(islandData.sculptureTag, islandData.accent);
          tagSpritesToRefresh.push(tagBundle);
          tagBundle.sprite.position.set(0, 4.9, 0);
          diorama.add(tagBundle.sprite);

          if (idx === 0) {
            // Island 01: Dual counter-rotating neon gyro rings + glowing octahedron core
            const r1 = new THREE.Mesh(
              new THREE.TorusGeometry(2.75, 0.14, 18, 56),
              new THREE.MeshStandardMaterial({ color: 0x818CF8, emissive: 0x4F46E5, emissiveIntensity: 0.45, metalness: 0.78, roughness: 0.18 })
            );
            const r2 = new THREE.Mesh(
              new THREE.TorusGeometry(2.05, 0.12, 18, 56),
              new THREE.MeshStandardMaterial({ color: 0x5EEAD4, emissive: 0x0D9488, emissiveIntensity: 0.42, metalness: 0.78, roughness: 0.18 })
            );
            const core = new THREE.Mesh(
              new THREE.OctahedronGeometry(1.18, 0),
              new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0x818CF8, emissiveIntensity: 0.65, metalness: 0.85, roughness: 0.12 })
            );
            diorama.add(r1, r2, core);
            animatedGroups.push({ type: 'gyro', r1: r1, r2: r2, core: core, speed: 0.02 });
          } else if (idx === 1) {
            // Island 02: 4 animated rising glowing cylindrical metric bars + floating crown crystal
            const heights = [2.5, 3.7, 4.9, 6.2];
            const cols = [0x38BDF8, 0x818CF8, 0x5EEAD4, 0xFBBF24];
            heights.forEach(function (h, bi) {
              const barG = new THREE.CylinderGeometry(0.54, 0.54, h, 24);
              barG.translate(0, h / 2, 0);
              const barM = new THREE.MeshStandardMaterial({
                color: cols[bi],
                emissive: cols[bi],
                emissiveIntensity: 0.3,
                metalness: 0.75,
                roughness: 0.2
              });
              const bar = new THREE.Mesh(barG, barM);
              bar.position.set(-2.35 + bi * 1.56, -2.8, 0);
              diorama.add(bar);
              animatedGroups.push({ type: 'barScale', mesh: bar, offset: bi * 0.8 });
            });
            const crown = new THREE.Mesh(
              new THREE.OctahedronGeometry(1.08, 0),
              new THREE.MeshStandardMaterial({ color: 0xFBBF24, emissive: 0xD97706, emissiveIntensity: 0.5, metalness: 0.9, roughness: 0.12 })
            );
            crown.position.set(2.35, 3.85, 0);
            diorama.add(crown);
            animatedGroups.push({ type: 'spinCrystal', mesh: crown, baseY: 3.85, offset: 1.2 });
          } else if (idx === 2) {
            // Island 03: Luminous glowing icosahedron AI brain core orbited by 7 colorful spheres
            const core = new THREE.Mesh(
              new THREE.IcosahedronGeometry(1.75, 1),
              new THREE.MeshStandardMaterial({ color: 0x38BDF8, emissive: 0x0284C7, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.18, flatShading: true })
            );
            diorama.add(core);
            const orbitGroup = new THREE.Group();
            diorama.add(orbitGroup);
            const orbCols = [0x5EEAD4, 0xFB7185, 0xC084FC, 0xFBBF24, 0x818CF8, 0x38BDF8, 0x34D399];
            for (let s = 0; s < 7; s++) {
              const ang = (s / 7) * Math.PI * 2;
              const sp = new THREE.Mesh(
                new THREE.SphereGeometry(0.42, 18, 18),
                new THREE.MeshStandardMaterial({ color: orbCols[s], emissive: orbCols[s], emissiveIntensity: 0.4, roughness: 0.18, metalness: 0.45 })
              );
              sp.position.set(Math.cos(ang) * 3.35, Math.sin(ang * 2) * 1.15, Math.sin(ang) * 3.35);
              orbitGroup.add(sp);
            }
            animatedGroups.push({ type: 'orbitSystem', core: core, orbit: orbitGroup, speed: 0.018 });
          } else if (idx === 3) {
            // Island 04: 3 floating translucent holographic architecture screens oscillating gently
            const slidesGroup = new THREE.Group();
            diorama.add(slidesGroup);
            const screenCols = [0xC084FC, 0x38BDF8, 0x5EEAD4];
            for (let p = 0; p < 3; p++) {
              const scr = new THREE.Mesh(
                new THREE.BoxGeometry(3.85, 2.25, 0.12),
                new THREE.MeshStandardMaterial({
                  color: screenCols[p],
                  emissive: screenCols[p],
                  emissiveIntensity: 0.32,
                  metalness: 0.72,
                  roughness: 0.18,
                  transparent: true,
                  opacity: 0.84
                })
              );
              scr.position.set((p - 1) * 1.15, (p - 1) * 0.92, (p - 1) * -0.95);
              scr.rotation.y = -0.28;
              slidesGroup.add(scr);
              animatedGroups.push({ type: 'floatSlide', mesh: scr, baseY: (p - 1) * 0.92, offset: p * 1.3 });
            }
          } else if (idx === 4) {
            // Island 05: SITED 2027 rotating wireframe conference globe with glowing orbital meridian rings
            const globeGroup = new THREE.Group();
            globeGroup.position.set(0, 0.4, 0);
            diorama.add(globeGroup);

            const wireGlobe = new THREE.Mesh(
              new THREE.IcosahedronGeometry(2.08, 2),
              new THREE.MeshBasicMaterial({ color: 0x60A5FA, wireframe: true, transparent: true, opacity: 0.65 })
            );
            const innerCore = new THREE.Mesh(
              new THREE.IcosahedronGeometry(1.38, 1),
              new THREE.MeshStandardMaterial({ color: 0x2563EB, emissive: 0x1D4ED8, emissiveIntensity: 0.45, metalness: 0.75, roughness: 0.18, flatShading: true })
            );
            const orbitA = new THREE.Mesh(
              new THREE.TorusGeometry(2.85, 0.085, 14, 56),
              new THREE.MeshStandardMaterial({ color: 0xFBBF24, emissive: 0xD97706, emissiveIntensity: 0.5, metalness: 0.85, roughness: 0.14 })
            );
            orbitA.rotation.x = Math.PI / 3;
            orbitA.rotation.y = 0.4;
            const orbitB = new THREE.Mesh(
              new THREE.TorusGeometry(3.25, 0.07, 14, 56),
              new THREE.MeshStandardMaterial({ color: 0x60A5FA, emissive: 0x2563EB, emissiveIntensity: 0.4, metalness: 0.75, roughness: 0.18 })
            );
            orbitB.rotation.x = -Math.PI / 3.2;
            orbitB.rotation.z = 0.55;

            globeGroup.add(wireGlobe, innerCore, orbitA, orbitB);
            animatedGroups.push({ type: 'conferenceGlobe', wire: wireGlobe, inner: innerCore, r1: orbitA, r2: orbitB, speed: 0.016 });
          } else if (idx === 5) {
            // Island 06: Sleek server pedestal with glowing holo-ring and spinning crystalline server core
            const pedestal = new THREE.Mesh(
              new THREE.BoxGeometry(4.2, 0.35, 2.9),
              new THREE.MeshStandardMaterial({ color: 0x1E293B, emissive: 0x111827, emissiveIntensity: 0.3, metalness: 0.85, roughness: 0.2 })
            );
            pedestal.position.set(0, -2.35, 0);
            diorama.add(pedestal);

            const holoRing = new THREE.Mesh(
              new THREE.TorusGeometry(2.25, 0.085, 14, 48),
              new THREE.MeshBasicMaterial({ color: 0xFB7185 })
            );
            holoRing.rotation.x = Math.PI / 2;
            holoRing.position.set(0, 0.55, 0);
            diorama.add(holoRing);

            const serverCore = new THREE.Mesh(
              new THREE.OctahedronGeometry(1.68, 0),
              new THREE.MeshStandardMaterial({
                color: 0xFB7185,
                emissive: 0xE11D48,
                emissiveIntensity: 0.45,
                metalness: 0.85,
                roughness: 0.14,
                flatShading: true
              })
            );
            serverCore.position.set(0, 0.85, 0);
            diorama.add(serverCore);

            animatedGroups.push({ type: 'spinCrystal', mesh: serverCore, baseY: 0.85, offset: 0.6 });
            animatedGroups.push({ type: 'ringPulse', mesh: holoRing, offset: 1.8 });
          } else {
            // Island 07: Octagonal pedestal with rotating golden torus-knot trophy
            const ped = new THREE.Mesh(
              new THREE.CylinderGeometry(2.05, 2.75, 2.25, 8),
              new THREE.MeshStandardMaterial({ color: 0x065F46, emissive: 0x047857, emissiveIntensity: 0.35, metalness: 0.8, roughness: 0.2 })
            );
            ped.position.set(0, -1.8, 0);
            diorama.add(ped);

            const trophy = new THREE.Mesh(
              new THREE.TorusKnotGeometry(1.82, 0.42, 108, 16),
              new THREE.MeshStandardMaterial({
                color: 0xFBBF24,
                emissive: 0xD97706,
                emissiveIntensity: 0.48,
                metalness: 0.92,
                roughness: 0.12
              })
            );
            trophy.position.set(0, 1.55, 0);
            diorama.add(trophy);
            animatedGroups.push({ type: 'spinCrystal', mesh: trophy, baseY: 1.55, offset: 0 });
          }
        });

        // Re-render canvas text textures once Google Fonts finish loading
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            textTexturesToRefresh.forEach(function (item) {
              drawFloatingTextCanvas(item.canvas, item.island, item.idx);
              item.tex.needsUpdate = true;
            });
            tagSpritesToRefresh.forEach(function (item) {
              drawTagSpriteCanvas(item.canvas, item.text, item.accent);
              item.tex.needsUpdate = true;
            });
          });
        }

        // ── 5. Smooth Camera Flight + Scroll, Keyboard & 360° Drag Controls ──
        const camCurve = new THREE.CatmullRomCurve3(cameraWaypoints);
        const lookCurve = new THREE.CatmullRomCurve3(islandWaypoints);

        let smoothT = 0;
        let dragYaw = 0;
        let dragPitch = 0;
        let isDragging = false;
        let prevPointer = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', function (e) {
          isDragging = true;
          prevPointer.x = e.clientX;
          prevPointer.y = e.clientY;
        });
        window.addEventListener('mouseup', function () { isDragging = false; });
        window.addEventListener('mousemove', function (e) {
          if (!isDragging) return;
          const dx = e.clientX - prevPointer.x;
          const dy = e.clientY - prevPointer.y;
          prevPointer.x = e.clientX;
          prevPointer.y = e.clientY;
          dragYaw = Math.max(-0.85, Math.min(0.85, dragYaw - dx * 0.004));
          dragPitch = Math.max(-0.45, Math.min(0.45, dragPitch - dy * 0.003));
        });

        canvas.addEventListener('touchstart', function (e) {
          if (e.touches.length === 1) {
            isDragging = true;
            prevPointer.x = e.touches[0].clientX;
            prevPointer.y = e.touches[0].clientY;
          }
        }, { passive: true });
        window.addEventListener('touchend', function () { isDragging = false; });
        window.addEventListener('touchmove', function (e) {
          if (!isDragging || e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - prevPointer.x;
          const dy = e.touches[0].clientY - prevPointer.y;
          prevPointer.x = e.touches[0].clientX;
          prevPointer.y = e.touches[0].clientY;
          dragYaw = Math.max(-0.75, Math.min(0.75, dragYaw - dx * 0.0035));
          dragPitch = Math.max(-0.35, Math.min(0.35, dragPitch - dy * 0.0025));
        }, { passive: true });

        function syncFromWindowScroll() {
          const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
          if (maxScroll > 10) {
            targetScrollT = Math.min(1, Math.max(0, window.scrollY / maxScroll));
          }
        }
        window.addEventListener('scroll', syncFromWindowScroll, { passive: true });

        window.addEventListener('wheel', function (e) {
          const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
          if (maxScroll <= 10) {
            targetScrollT = Math.min(1, Math.max(0, targetScrollT + e.deltaY * 0.00042));
          }
        }, { passive: true });

        window.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') {
            e.preventDefault();
            jumpToChapter(Math.min(TOTAL_ISLANDS, currentChapterIndex + 1));
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') {
            e.preventDefault();
            jumpToChapter(Math.max(1, currentChapterIndex - 1));
          } else if (e.key === 'n' || e.key === 'N') {
            toggleSpeakerCues();
          }
        });

        window.addEventListener('resize', function () {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        syncFromWindowScroll();
        updateStoryHUD(1);

        // ── 6. Main Animation Loop ──
        let clock = 0;
        function animateWorld() {
          requestAnimationFrame(animateWorld);
          clock += 0.024;

          smoothT += (targetScrollT - smoothT) * 0.075;
          if (warpPulse > 0.01) warpPulse *= 0.92;

          const bar = document.getElementById('scroll-progress-bar');
          if (bar) bar.style.width = Math.max(4, Math.round(smoothT * 100)) + '%';

          const nearestIsland = Math.min(TOTAL_ISLANDS, Math.max(1, Math.round(smoothT * (TOTAL_ISLANDS - 1)) + 1));
          updateStoryHUD(nearestIsland);

          const clampedT = Math.min(1, Math.max(0, smoothT));
          const camPos = camCurve.getPointAt(clampedT);
          const lookTarget = lookCurve.getPointAt(clampedT);

          camera.position.copy(camPos);
          const targetWithLook = lookTarget.clone();
          targetWithLook.x += Math.sin(dragYaw) * 18;
          targetWithLook.y += dragPitch * 12 + 2.3;
          camera.lookAt(targetWithLook);

          // Dual traveling aurora point lights
          pointLightCyanMint.position.set(camPos.x + 12, camPos.y + 9, camPos.z - 15);
          pointLightOrchidCoral.position.set(camPos.x - 12, camPos.y + 6, camPos.z - 22);

          // Gentle floating bokeh sky motion
          starField.position.y = Math.sin(clock * 0.35) * 0.85;

          // Highway energy stream particles
          for (let i = 0; i < streamSpheres.length; i++) {
            const item = streamSpheres[i];
            item.t = (item.t + 0.001 + warpPulse * 0.0018) % 1;
            const pt = roadCurve.getPointAt(item.t);
            item.mesh.position.set(
              pt.x + Math.cos(clock * 1.4 + item.orbitOffset) * 0.55,
              pt.y + 1.65 + Math.sin(clock * 1.4 + item.orbitOffset) * 0.2,
              pt.z
            );
          }

          // Floating holographic text bobbing
          for (let i = 0; i < floatingTextMeshes.length; i++) {
            const ft = floatingTextMeshes[i];
            ft.mesh.position.y = ft.baseY + Math.sin(clock * 1.35 + ft.offset) * 0.22;
          }

          // Bespoke 3D sculpture animations
          const boost = 1 + warpPulse * 2.4;
          for (let i = 0; i < animatedGroups.length; i++) {
            const ag = animatedGroups[i];
            if (ag.type === 'gyro') {
              ag.r1.rotation.y += ag.speed * boost;
              ag.r1.rotation.x += ag.speed * 0.5 * boost;
              ag.r2.rotation.y -= ag.speed * 1.18 * boost;
              ag.r2.rotation.z += ag.speed * 0.72 * boost;
              ag.core.rotation.y += ag.speed * 1.45;
              ag.core.position.y = Math.sin(clock * 1.7) * 0.24;
            } else if (ag.type === 'barScale') {
              const s = 0.84 + Math.sin(clock * 1.9 + ag.offset) * 0.16;
              ag.mesh.scale.set(1, s, 1);
            } else if (ag.type === 'spinCrystal') {
              ag.mesh.rotation.y += 0.02 * boost;
              ag.mesh.rotation.x = Math.sin(clock + ag.offset) * 0.22;
              ag.mesh.position.y = ag.baseY + Math.sin(clock * 1.6 + ag.offset) * 0.28;
            } else if (ag.type === 'orbitSystem') {
              ag.core.rotation.y -= 0.012 * boost;
              ag.orbit.rotation.y += ag.speed * boost;
              ag.orbit.rotation.z = Math.sin(clock * 0.8) * 0.2;
            } else if (ag.type === 'floatSlide') {
              ag.mesh.position.y = ag.baseY + Math.sin(clock * 1.6 + ag.offset) * 0.28;
              ag.mesh.rotation.y = -0.28 + Math.sin(clock + ag.offset) * 0.08;
            } else if (ag.type === 'ringPulse') {
              const rs = 1 + Math.sin(clock * 1.6 + ag.offset) * 0.055;
              ag.mesh.scale.set(rs, rs, 1);
            } else if (ag.type === 'conferenceGlobe') {
              ag.wire.rotation.y += ag.speed * boost;
              ag.wire.rotation.x += ag.speed * 0.28 * boost;
              ag.inner.rotation.y -= ag.speed * 1.35 * boost;
              ag.r1.rotation.z += ag.speed * 1.1 * boost;
              ag.r2.rotation.y -= ag.speed * 1.25 * boost;
            }
          }

          if (!isDragging) {
            dragYaw *= 0.94;
            dragPitch *= 0.94;
          }

          renderer.render(scene, camera);
        }

        animateWorld();
      } catch (err) {
        console.error('3D World initialization error:', err);
      }
    }

    window.addEventListener('load', initComplete3DWorld);
  </script>
</body>
</html>
